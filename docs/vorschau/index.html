<body>
<div class="page">
  <h1>Jellydroid</h1>
  <p>Nachbau der Oberfläche nach dem Launcher-Code, Stand V1.9. Bilder und Titel sind Platzhalter.</p>
  <div id="screens"></div>
</div>

<script>
const IMG = n => `bilder/${n}.jpg`;
const W = "#fff";

/* Symbole aus ui/Icons.kt, 24er-Raster */
const sv = (inner, sw = 1.9, c = W) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICON = {
  sidebar: c => sv(`<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M14.5 4V20"/>`, 1.9, c),
  house: c => sv(`<path d="M3 11 12 3.5 21 11"/><path d="M5.5 9.5V20H18.5V9.5"/><path d="M10 20V14H14V20"/>`, 1.9, c),
  wifi: c => {
    const a = r => `M${12 - .7071 * r} ${19 - .7071 * r}A${r} ${r} 0 0 1 ${12 + .7071 * r} ${19 - .7071 * r}`;
    return sv(`<path d="${a(4.5)}"/><path d="${a(9)}"/><path d="${a(13.5)}"/><circle cx="12" cy="19" r="1.3" fill="${c}" stroke="none"/>`, 1.9, c);
  },
  airplay: c => sv(`<path d="M6 17H4L3 16V5L4 4H20L21 5V16L20 17H18"/><path d="M12 14 17 20H7Z"/>`, 1.8, c),
  source: c => sv(`<rect x="1.92" y="3.36" width="20.16" height="13.44" rx="2.16"/><path d="M12 16.8V20.64"/><path d="M7.68 21.12H16.32"/><path d="M10.56 7.68 13.92 10.08 10.56 12.48"/>`, 2.16, c),
  gear: c => {
    let s = `<circle cx="12" cy="12" r="6.48"/><circle cx="12" cy="12" r="2.4"/>`;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, ci = Math.cos(a), si = Math.sin(a);
      s += `<path d="M${12 + ci * 7.68} ${12 + si * 7.68}L${12 + ci * 11.04} ${12 + si * 11.04}" stroke-width="3.36"/>`;
    }
    return sv(s, 2.4, c);
  },
  back: c => sv(`<path d="M14.5 6 8.5 12 14.5 18"/>`, 2.2, c),
  chevron: c => sv(`<path d="M6.5 9.5 12 15 17.5 9.5"/>`, 2.4, c),
  bulb: c => sv(`<path d="M9 18H15"/><path d="M10 21.5H14"/><circle cx="12" cy="9" r="6.2"/><path d="M9.3 14.5V18"/><path d="M14.7 14.5V18"/>`, 1.8, c),
  plug: c => sv(`<path d="M9 2V8"/><path d="M15 2V8"/><path d="M6 8H18V11L16.5 15 12 17 7.5 15 6 11Z"/><path d="M12 17V22"/>`, 1.8, c),
  thermo: c => sv(`<path d="M10 14.5V5L11 3.2 12 3 13 3.2 14 5V14.5"/><circle cx="12" cy="17.5" r="3.6"/><path d="M12 9V15"/>`, 1.8, c),
  bell: c => sv(`<path d="M6 16V10L7.5 6 12 4 16.5 6 18 10V16L20 18H4Z"/><path d="M10 21H14"/>`, 2, c),
  close: c => sv(`<path d="M6.5 6.5 17.5 17.5"/><path d="M17.5 6.5 6.5 17.5"/>`, 2.4, c),
};

/* Platzhalter-Katalog */
const M = {
  gipfel:   { t: "Gipfelsturm", img: "berge", sub: "2025 · 118 Min. · Abenteuer", fsk: "FSK 12", r: "7,8", crit: 91, ov: "Eine Bergführerin will ihre Seilschaft vor dem Wintereinbruch über den Grat bringen. Doch das Wetter dreht schneller als gedacht, und der einzige Abstieg führt durch die Nordwand." },
  nord:     { t: "Nordlicht", img: "polarlicht", sub: "S2 · F4 · Die lange Nacht", prog: .62, r: "8,4", ov: "Auf einer Forschungsstation am Polarkreis fällt der Funk aus. Während draußen das Polarlicht tanzt, wächst drinnen das Misstrauen." },
  stadt:    { t: "Die Stadt der Lichter", img: "stadt", sub: "S1 · F7 · Nachtschicht", prog: .35 },
  meer:     { t: "Weites Meer", img: "meer", sub: "2024 · 96 Min. · Drama", prog: .8 },
  fels:     { t: "Roter Fels", img: "canyon", sub: "2023 · 104 Min. · Western" },
  orbit:    { t: "Orbit", img: "weltall", sub: "2026 · Science-Fiction", r: "7,4", seerr: true, ov: "Sechs Monate allein auf einer Raumstation, dann empfängt die Astronautin Lea Varga ein Signal, das es nicht geben dürfte. Die Bodenstation glaubt ihr nicht, und der Sauerstoff reicht nur noch für 40 Tage.", cast: ["Mara Kessler", "Jonas Albrecht", "Ida Nowak", "Paul Brenner"] },
  sand:     { t: "Sandsturm", img: "wueste", sub: "2025 · 121 Min. · Thriller" },
  wald:     { t: "Nebelwald", img: "wald", sub: "2022 · 99 Min. · Mystery" },
  herbst:   { t: "Letzter Sommer", img: "herbst", sub: "2024 · 92 Min. · Komödie" },
  neon:     { t: "Neonfahrt", img: "neon", sub: "2026 · 110 Min. · Action" },
  see:      { t: "Stille Wasser", img: "see", sub: "S3 · F1 · Rückkehr", prog: .15 },
  schnee:   { t: "Weißes Schweigen", img: "schnee", sub: "2023 · 101 Min. · Krimi" },
};

/* ---------- Bausteine ---------- */
function topBar(sel) {
  const tabs = ["Startseite", "Entdecken", "Apps"].map((t, i) => `<div class="tab${i === sel ? " on" : ""}">${t}</div>`).join("");
  return `<div class="bar">
    <div class="tabs glass">${tabs}</div>
    <div class="sys glass"><span class="clock">20:15</span><span class="sdot"></span>
      <div class="cbtn"><div class="ava">•</div></div>
      <div class="cbtn">${ICON.sidebar(W)}</div>
      <div class="cbtn">${ICON.house(W)}</div>
    </div></div>`;
}
const badge = (l, v, bg, fg) => `<span class="badge"><b style="background:${bg};color:${fg}">${l}</b><i> ${v}</i></span>`;
function metaLine(m, tech = []) {
  let s = "";
  if (m.r) s += badge(m.seerr ? "TMDB" : "IMDb", m.r, "#F5C518", "#000");
  if (m.crit) s += badge(m.crit >= 60 ? "🍅" : "🤢", `${m.crit} %`, "rgba(255,255,255,.2)", "#fff");
  const sub = m.sub && !m.sub.startsWith("S") ? m.sub : null;
  if (sub) s += `<span class="s">${sub}</span>`;
  if (tech.length) { if (sub) s += `<span class="f">·</span>`; s += `<span class="techs">${tech.map(t => `<span>${t}</span>`).join("")}</span>`; }
  if (m.fsk) s += `<span class="f">${m.fsk}</span>`;
  return `<div class="meta">${s}</div>`;
}
const pill = (t, kind = "", fx = false) => `<div class="pill ${kind}${fx ? " fx" : ""}">${t}</div>`;
function hero(m, eyebrow, buttons, stage = 0, prog = .4) {
  const cls = stage === 1 ? " compact" : stage === 2 ? " gone" : "";
  const dots = Array.from({ length: 6 }, (_, i) => i === 0 ? `<i class="a" style="--p:${prog * 100}%"></i>` : "<i></i>").join("");
  const txt = stage === 0
    ? `<div class="eyebrow">${eyebrow.toUpperCase()}</div><div class="headline">${m.t}</div>${metaLine(m)}<div class="body overview">${m.ov || ""}</div>`
    : `<div class="headline">${m.t}</div><div class="body" style="margin-top:6px;color:rgba(255,255,255,.6)">${m.sub || ""}</div>`;
  return `<div class="hero${cls}"><div class="txt">${txt}</div>
    <div class="btnrow"><div class="pills">${buttons}</div><div class="dots">${dots}</div></div></div>`;
}
function mediaTile(m, w, fx = false) {
  return `<div class="mt${fx ? " fx" : ""}" style="width:${w}px"><div class="img"><img src="${IMG(m.img)}" alt="">${m.prog ? `<div class="prog"><i style="width:${m.prog * 100}%"></i></div>` : ""}</div>
    <div class="t">${m.t}</div><div class="u">${m.sub || ""}</div></div>`;
}
function mediaRow(title, source, items, w, focusIndex = -1) {
  return `<div class="rtitle">${title}<small>  ${source}</small></div>
    <div class="lane">${items.map((m, i) => mediaTile(m, w, i === focusIndex)).join("")}</div>`;
}
const backdrop = img => `<div class="glow"></div><div class="backdrop"><img src="${IMG(img)}" alt=""></div>`;

/* ---------- Ansichten ---------- */
function discover({ dialog = "" } = {}) {
  const m = M.gipfel;
  return `${backdrop(m.img)}<div class="col">${topBar(1)}
    ${hero(m, "Beliebt", pill("▶  Abspielen", "p", !dialog) + pill("Details"))}
    <div class="rows">
      ${mediaRow("Beliebt", "Gerade gefragt", [M.gipfel, M.orbit, M.sand, M.neon, M.wald, M.herbst], 200)}
      ${mediaRow("Deine Anfragen", "Seerr", [M.fels, M.schnee, M.see, M.meer, M.stadt], 200)}
    </div></div>${dialog}`;
}

function start() {
  const apps = [
    ["Plezy", "P", "linear-gradient(135deg,#F2A93B,#E0702A)"],
    ["Jellyfin", "J", "linear-gradient(135deg,#AA5CC3,#00A4DC)"],
    ["SmartTube", "▶", "linear-gradient(135deg,#E94545,#B32626)"],
    ["Musik", "♪", "linear-gradient(135deg,#3BC48A,#1E8C66)"],
    ["Mediathek", "M", "linear-gradient(135deg,#4F7BE8,#2E4FB0)"],
    ["VLC", "V", "linear-gradient(135deg,#FF9A2E,#E46A00)"],
  ];
  const tiles = apps.map(([n, l, g], i) => `<div class="at${i === 0 ? " fx" : ""}"><div class="ic" style="background:${g}">${l}</div><div class="l">${n}</div></div>`).join("")
    + `<div class="at add">+</div>`;
  return `${backdrop(M.nord.img)}<div class="col">${topBar(0)}
    ${hero(M.nord, "Weiterschauen", "", 2)}
    <div style="flex:1;min-height:0">
      <div class="fadeR">${mediaRow("Weiterschauen", "Jellyfin", [M.nord, M.stadt, M.meer, M.see], 264)}</div>
      <div style="height:6px"></div>
      <div class="rtitle">Favoriten<small>  Apps</small></div>
      <div style="height:10px"></div>
      <div class="applane fadeR">${tiles}</div>
    </div></div>`;
}

function detailDialog() {
  const m = M.orbit;
  return `<div class="scrim"><div class="dlg">
    <div class="pic"><img src="${IMG(m.img)}" alt=""></div>
    <div class="in">
      <h2>${m.t}</h2>
      ${metaLine(m)}
      <div class="body ov">${m.ov}</div>
      <div class="cast">Mit ${m.cast.join(", ")}</div>
      <div class="pills">${pill("＋  Anfragen", "p", true)}${pill("Trailer ansehen")}${pill("Interessiert mich nicht")}</div>
    </div>
    <div class="xbtn">${ICON.close(W)}</div>
  </div></div>`;
}

function sidebarMain() {
  const q = (n, s, icon, cls = "", fx = false) =>
    `<div class="qt ${cls}${fx ? " fx2" : ""}">${icon}<div><div class="n">${n}</div><div class="s">${s}</div></div></div>`;
  return `<div class="shade"></div><div class="side">
    <div class="shead"><div class="when"><div class="date">So., 22. Nov.</div><div class="big">20:15</div></div>
      <div style="display:flex;align-items:flex-start"><div class="gear"><div class="b">${ICON.gear("#F4F6FB")}</div><small>Einstellungen</small></div><div class="sava"></div></div></div>
    <div class="qgrid">
      ${q("Home Assistant", "Wohnzimmer · 3 an", ICON.house("#F4F6FB"), "", true)}
      ${q("WLAN", "Heimnetz", ICON.wifi("#F4F6FB"))}
      ${q("Quelle", "Eingang wählen", ICON.source("#F4F6FB"))}
      ${q("AirPlay", "An", ICON.airplay("#F4F6FB"), "on")}
    </div></div>`;
}

function sidebarHa() {
  const scene = (g, n) => `<div class="scene"><span class="m">${g}</span><span class="n">${n}</span></div>`;
  const dev = (n, on, pct, plug, fx) => {
    const ic = (plug ? ICON.plug : ICON.bulb)(on ? "#FFD08A" : "rgba(255,255,255,.62)");
    const st = !on ? "Aus" : pct != null ? `An · ${pct} %` : "An";
    const tr = pct !== undefined ? `<div class="tr">${on ? `<i style="width:${pct}%"></i>` : ""}</div>` : "";
    return `<div class="dev${on ? " on" : ""}${fx ? " fx2" : ""}">${ic}<div class="n">${n}</div><div class="s">${st}</div>${tr}</div>`;
  };
  const min = 7, max = 30, target = 21.5, ist = 20, w = 262 - 26;
  const pT = (target - min) / (max - min), pI = (ist - min) / (max - min);
  return `<div class="shade"></div><div class="side">
    <div class="room"><div class="rb">${ICON.back("#F4F6FB")}</div>
      <div style="display:flex;align-items:center;gap:7px"><div class="rname">Wohnzimmer</div><div class="chev">${ICON.chevron("#F4F6FB")}</div></div></div>
    <div class="chips"><div class="chip sel">Alle</div><div class="chip">Licht</div><div class="chip">Schalter</div></div>
    <div class="scenes">${scene("\u{F0FCE}", "Kino")}${scene("\u{F04B9}", "Abend")}${scene("\u{F0594}", "Nacht")}</div>
    <div class="heat"><div class="top">${ICON.thermo("#FF9A6A")}<span class="tv2">21,5 °C</span><span class="hd"></span><span class="st">Heizen</span><span class="ist">Ist 20,0 °C</span></div>
      <div class="track"><div class="all"></div><div class="act" style="left:${pI * 100}%;width:${(pT - pI) * 100}%;background-position:-${pI * w}px 0"></div>
        <div class="idot" style="left:${pI * 100}%"></div><div class="knob" style="left:${pT * 100}%"></div></div></div>
    <div class="devs">
      ${dev("Deckenlicht", true, 60, false, true)}
      ${dev("Stehlampe", true, 35)}
      ${dev("LED-Leiste", false, 0)}
      ${dev("Soundbar", true, null, true)}
    </div></div>`;
}

function film(img) { return `<div class="film"><img src="${IMG(img)}" alt=""></div>`; }

function doorbell() {
  return `${film("see")}<div class="bell">
    <div class="h"><div class="ic">${ICON.bell("#FFD08A")}</div><div><div class="t">Es klingelt</div><div class="nm">Haustür</div></div></div>
    <div class="bs"><div class="bb fx">Tür öffnen</div><div class="bb">Schließen</div></div>
    <div class="pg"><i></i></div></div>`;
}

const SCREENS = [
  ["entdecken", "Entdecken", "Mediathek und Trends aus Jellyfin und Seerr, Wiedergabe in Plezy.", () => discover()],
  ["startseite", "Startseite", "Weiterschauen und Favoriten.", () => start()],
  ["anfragen", "Anfragen über Seerr", "Fehlt ein Titel, reicht ein Klick auf „Anfragen“.", () => discover({ dialog: detailDialog() })],
  ["sidebar", "Sidebar", "Öffnet per Taste über jeder App.", () => discover() + sidebarMain()],
  ["homeassistant", "Home Assistant", "Szenen, Heizung und Licht im gewählten Raum.", () => film("stadt") + sidebarHa()],
  ["klingel", "Türklingel", "Hinweis beim Klingeln, mit Türsummer direkt öffnen.", () => doorbell()],
];

const shot = new URLSearchParams(location.search).get("shot");
if (shot) document.body.classList.add("shot");
document.getElementById("screens").innerHTML = SCREENS
  .filter(([id]) => !shot || id === shot)
  .map(([id, title, sub, f]) => `<figure id="${id}"><div class="frame"><div class="tv">${f()}</div></div><figcaption>${title}<span>${sub}</span></figcaption></figure>`)
  .join("");

function fit() {
  if (shot) return;
  document.querySelectorAll(".frame").forEach(fr => { fr.firstElementChild.style.transform = `scale(${fr.clientWidth / 960})`; });
}
addEventListener("resize", fit); fit();
</script>
